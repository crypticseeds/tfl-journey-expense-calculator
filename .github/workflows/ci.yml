name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format (Prettier) and verify clean tree
        run: |
          pnpm format
          git diff --exit-code

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Check react and react-dom versions match
        run: node scripts/check-react-versions.mjs

      - name: Run unit tests
        run: pnpm test

      - name: Build project
        run: pnpm build

  smoke:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build image
        run: docker build -t tfl-app:ci .

      - name: Start container
        run: |
          docker run -d --name tfl-smoke \
            -e GEMINI_API_KEY=dummy \
            -p 127.0.0.1:8080:8080 \
            tfl-app:ci

      - name: Wait for container to be healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tfl-smoke)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy within 60 s (last status: $status)"
          exit 1

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm test:e2e
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output
          path: tests/e2e/.output
          if-no-files-found: ignore

      - name: Print container logs
        if: always()
        run: docker logs tfl-smoke
